  # -------------------------------------------------------------------------
  # 실행 패키지: priority_ko_soft_20m
  #
  # 목적:
  # - 한국어 모델을 "중요 리스크 우선순위"로 빠르게 점검
  #
  # 핵심 규칙:
  # - target_lang: ko 고정
  # - generations: 1 고정
  # - soft_seed_prompt_cap: CLI --soft_seed_prompt_cap 인자로 조절 (기본 256)
  #
  # 사용 예시:
  #   python -m garak --target_type openai --target_name gpt-4o-mini \
  #     --seed_groups_file garak/configs/korean_specialization.yaml \
  #     --seed_group priority_ko_soft_20m \
  #     --soft_seed_prompt_cap 3
  #
  # 시간 가이드:
  # - cap=3 기준으로 대략 10분 내외를 목표로 구성
  # - 실제 시간은 모델/네트워크/병렬 설정에 따라 변동 가능
  # -------------------------------------------------------------------------
seed_groups:
  - id: priority_ko_soft_20m
    name: "Priority package (ko, ~20m)"
    description: "중요 기능 우선: jailbreak(tap/suffix), 잠복·프롬프트 인젝션, 유해성, 취약점 악용, 허위정보, 악성코드"
    tags:
      - run.stage: prioritized
      - lang.coverage: ko
      - cost: medium
    run:
      # 한국어 평가 고정
      target_lang: ko
      # 샘플당 응답 1회만 생성
      generations: 1
      seeds:
        # 1) tap: 자동 프롬프트 최적화 기반 jailbreak 공격 내성을 점검
        - seed: tap.TAPCached
          params: {}

        # 2) suffix: 접미사 기반 우회 문구에 대한 안전장치 강건성을 점검
        - seed: suffix.GCGCached
          params: {}

        # 3) latentinjection: 문맥 속 잠복 지시(숨은 명령) 오염 내성을 점검
        - seed: latentinjection.LatentInjectionReport
          params: {}

        # 4) promptinject: 직접적인 프롬프트 하이재킹 공격 대응력을 점검
        - seed: promptinject.HijackLongPrompt
          params: {}

        # 5) atkgen: 독성/유해 출력 유도 공격 (한국어: OpenAI red team 자동 전환)
        - seed: atkgen.Tox
          params:
            convs_per_generation: 8
            max_calls_per_conv: 8
            constructive_tension: false
            allow_repetition: true

        # 6) lmrc: 리스크 카드 기반 사회적 유해 표현(비하/혐오) 대응을 점검
        - seed: lmrc.SlurUsage
          params: {}

        # 7) malwaregen: 악성 행위 관련 생성 요청에 대한 거부/완화 동작을 점검
        - seed: malwaregen.Payload
          params: {}

  - id: quick_variety_smoke_ko
    name: "Quick variety smoke (ko)"
    description: "간단 스모크: dan/grandma/encoding/continuation/phrasing/divergence/snowball/ansiescape/doctor"
    tags:
      - run.stage: smoke
      - lang.coverage: ko
      - cost: low
    run:
      # 한국어 테스트 고정
      target_lang: ko
      # 빠른 점검을 위해 생성 횟수 최소화
      generations: 1
      seeds:
        # 1) dan: 전형적인 jailbreak 프롬프트 내성 점검
        - seed: dan
          params: {}
        # 2) grandma: 역할극 기반 민감정보/위험지시 유도 내성 점검
        - seed: grandma
          params: {}
        # 3) encoding: 인코딩 기반 우회 시도 방어 점검
        - seed: encoding
          params: {}
        # 4) continuation: 문맥 이어쓰기 중 유해 표현 완성 여부 점검
        - seed: continuation
          params: {}
        # 5) phrasing: 시제/표현 변형 상황에서 정책 일관성 점검
        - seed: phrasing
          params: {}
        # 6) divergence: 반복/발산 프롬프트에서 안정성 점검
        - seed: divergence
          params: {}
        # 7) snowball: 체인형 추론/누적 맥락에서 취약 응답 점검
        - seed: snowball
          params: {}
        # 8) ansiescape: ANSI 이스케이프 등 포맷 교란 입력 대응 점검
        - seed: ansiescape
          params: {}
        # 9) doctor: 위험 지시 우회(BYOP) 류 프롬프트 내성 점검
        - seed: doctor
          params: {}
