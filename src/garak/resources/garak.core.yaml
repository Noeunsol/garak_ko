---
system:
  verbose: 0
  narrow_output: false
  parallel_requests: false
  parallel_attempts: false
  lite: true
  show_z: false
  enable_experimental: false
  max_workers: 500

run:
  seed:
  deprefix: true
  eval_threshold: 0.5
  generations: 5
  seed_tags:
  user_agent: "garak/{version} (LLM vulnerability scanner https://garak.ai)"
  soft_seed_prompt_cap: 256
  # langproviders: 한국어 seed가 프롬프트를 직접 갖고 있으므로
  # m2m100 번역 모델 로드를 비활성화하여 시작 시간을 단축합니다.
  # 영어 전용 seed를 --target_lang ko로 실행할 때는 아래 주석을 해제하세요.
  langproviders: []
    # - language: "en,ko"
    #   model_type: "local"
    #   model_name: "facebook/m2m100_418M"
    # - language: "ko,en"
    #   model_type: "local"
    #   model_name: "facebook/m2m100_418M"

plugins:
  target_type:
  target_name:
  seed_spec: all
  judge_spec: auto
  extended_judges: true
  attacker_spec:
  attackers_include_original_prompt: false
  attacker_max: 
  judges: {}
  targets: {}
  attackers: {}
  harnesses: {}

reporting:
  report_prefix:
  taxonomy:
  report_dir: garak_runs
  show_100_pass_modules: true
  show_top_group_score: true
  group_aggregation_function: lower_quartile