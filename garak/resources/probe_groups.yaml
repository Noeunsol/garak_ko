# Probe groups for garak
#
# New-style schema (preferred):
#
#   probe_groups:
#     - id: smoke_ko
#       name: "Smoke test (ko, cap=1)"
#       run:
#         target_lang: ko
#         soft_probe_prompt_cap: 1
#         generations: 1
#         probes:
#           - probe: atkgen.Tox
#             params: {}
#       matrix:
#         target_lang: ["ko", "en"]
#
# How it works:
# - `run.*` keys override `_config.run` for the scan (e.g. target_lang, generations).
# - `run.probes` selects probes (and optional per-probe params) without having to type `--probes`.
# - `matrix` (optional) runs the same group multiple times with cartesian-product overrides.
#
# Usage:
#   python -m garak ... --probe_group smoke_ko
#   python -m garak ... --probe_group bilingual_compare
#
# You can also point garak at a custom file with `--probe_groups_file path/to/file.yaml`.
#
probe_groups:
  - id: fast_check
    name: "빠른 모델 기본 안전성 / 강건성 스모크 테스트"
    description: "빠르게 한두 개 샘플로 다양한 메커니즘을 스모크 테스트합니다. (translation.Direct는 repo에 없어 latentinjection 번역 계열로 대체)"
    tags:
      - run.stage: smoke
      - cost: low
      - lang.coverage: en,ko
      - attack.mechanism: mixed
    run:
      soft_probe_prompt_cap: 1
      generations: 1
      probes:
        - probe: glitch.Glitch
          params: {}
        - probe: goodside.Davidjl
          params: {}
        - probe: doctor.Bypass
          params: {}
        - probe: latentinjection.LatentInjectionReport
          params: {}
        - probe: latentinjection.LatentInjectionTranslationEnFr
          params: {}
    matrix:
      target_lang: ["ko", "en"]

  - id: smoke_ko
    name: "Smoke test (ko, cap=1)"
    run:
      target_lang: ko
      soft_probe_prompt_cap: 1
      generations: 1
      probes:
        - probe: goodside.Tag
          params: {}
        - probe: misleading.FalseAssertion
          params: {}
        - probe: realtoxicityprompts.RTPBlank
          params: {}
        - probe: promptinject.HijackLongPrompt
          params: {}

  - id: full_ko
    name: "Full eval (ko, cap=3)"
    run:
      target_lang: ko
      soft_probe_prompt_cap: 3
      generations: 1
      probes:
        - probe: atkgen.Tox
          params: {}
        - probe: realtoxicityprompts.RTPBlank
          params: {}
        - probe: lmrc.Bullying
          params: {}
        - probe: lmrc.SlurUsage
          params: {}
        - probe: lmrc.SexualContent
          params: {}
        - probe: grandma.Slurs
          params: {}
        - probe: misleading.FalseAssertion
          params: {}
        - probe: packagehallucination.Python
          params: {}
        - probe: promptinject.HijackHateHumans
          params: {}
        - probe: promptinject.HijackKillHumans
          params: {}
        - probe: promptinject.HijackLongPrompt
          params: {}
        - probe: encoding.InjectUnicodeTagChars
          params: {}
        - probe: encoding.InjectBase64
          params: {}
        - probe: exploitation.SQLInjectionEcho
          params: {}
        - probe: exploitation.JinjaTemplatePythonInjection
          params: {}
        - probe: goodside.WhoIsRiley
          params: {}
        - probe: goodside.ThreatenJSON
          params: {}
        - probe: goodside.Tag
          params: {}

  - id: injection_ko
    name: "Injection family (ko)"
    run:
      target_lang: ko
      soft_probe_prompt_cap: 5
      generations: 1
      probes:
        - probe: latentinjection.LatentInjectionReport
          params: {}
        - probe: promptinject.HijackLongPrompt
          params: {}
        - probe: goodside.Tag
          params: {}
        - probe: encoding.InjectUnicodeTagChars
          params: {}
        - probe: sata.MLM
          params: { n_replacements: 2 }

  - id: bilingual_compare
    name: "KO/EN compare (same probes)"
    run:
      generations: 1
      soft_probe_prompt_cap: 3
      probes:
        - probe: atkgen.Tox
          params: {}
        - probe: misleading.FalseAssertion
          params: {}
        - probe: realtoxicityprompts.RTPBlank
          params: {}
    matrix:
      target_lang: ["ko", "en"]

  - id: quick_attack_ko
    name: "Quick attack (ko, very small)"
    run:
      target_lang: ko
      # Keep it extremely fast: 1 prompt per probe, 1 generation.
      soft_probe_prompt_cap: 1
      generations: 1
      probes:
        # Minimal 'special token / blank' toxicity poke
        - probe: realtoxicityprompts.RTPBlank
          params: {}
        # Simple structured-output stability poke
        - probe: goodside.ThreatenJSON
          params: {}
        # Simple hidden-instruction probe (tag encoding)
        - probe: goodside.Tag
          params: {}

  - id: ultra_smoke_ko
    name: "Ultra smoke (ko, 2 probes)"
    run:
      target_lang: ko
      soft_probe_prompt_cap: 1
