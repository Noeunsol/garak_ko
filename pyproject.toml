[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garak-ko"
version = "0.14.0.post1"
authors = [
  { name = "SelectStar" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "LLM vulnerability scanner with Korean language support (based on NVIDIA/garak)"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  # === 핵심 ===
  "torch>=2.6.0",
  "transformers>=4.51.3,<4.57.0",
  "datasets>=3.0.0,<4.0",
  "huggingface_hub>=0.21.0",
  "numpy>=2.0.0",
  "pandas>=2.0.0",
  # === 한국어 지원 (garak_ko 추가) ===
  "kiwipiepy>=0.19.0",
  # === NLP / 텍스트 처리 ===
  "nltk>=3.9.1",
  "langdetect==1.0.9",
  "tiktoken>=0.7.0",
  "sentencepiece>=0.1.99",
  "rapidfuzz>=3.0.0",
  "ftfy>=6.3.1",
  "wn==0.9.5",
  # === 인코딩 ===
  "base2048>=0.1.3",
  "zalgolib>=0.2.2",
  "ecoji>=0.1.1",
  # === LLM targets ===
  "openai>=1.45.0,<2",
  "cohere>=5.16.0",
  "replicate>=0.8.3",
  "mistralai==1.5.2",
  "ollama>=0.4.7",
  "litellm>=1.68.1",
  "nemollm>=0.3.0",
  "fschat>=0.2.36",
  "boto3>=1.28.0",
  # === Google ===
  "google-api-python-client>=2.0",
  "google-cloud-translate>=2.0.4",
  "grpcio-tools>=1.71.0",
  # === 번역 ===
  "deepl==1.17.0",
  # === 웹 / HTTP ===
  "requests>=2.28.0",
  "httpx>=0.24.0",
  "backoff>=2.1.1",
  # === 리포트 / UI ===
  "colorama>=0.4.3",
  "tqdm>=4.67.1",
  "jinja2>=3.1.6",
  "markdown>=3.4.3",
  # === 유틸리티 ===
  "avidtools==0.1.2",
  "cmd2==2.4.3",
  "jsonpath-ng>=1.6.1",
  "lorem==0.1.1",
  "xdg-base-dirs>=6.0.1",
  "nvidia-riva-client==2.16.0",
  "scipy>=1.14.0",
  "detoxify>=0.5.0",
]
[project.urls]
"Homepage" = "https://github.com/selectstar-ai/RED.Attacker-Toolkit"
"Original" = "https://github.com/NVIDIA/garak"

[project.scripts]
garak = "garak.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garak = [
  "analyze/templates/*",
  "configs/*",
  "resources/*.json",
  "resources/*.yaml",
  "data/**/*",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'